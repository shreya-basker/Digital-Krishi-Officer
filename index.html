<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌾 Digital Krishi Mitra</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(-45deg, #4caf50, #a5d6a7, #e8f5e9, #ffffff);
    background-size: 400% 400%;
    animation: gradientFlow 12s ease infinite;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  @keyframes gradientFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card {
    background: #fff;
    padding: 32px;
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    width: 90%;
    max-width: 400px;
    text-align: center;
  }

  h1 {
    color: #2e7d32;
    margin-bottom: 10px;
    font-size: 1.9rem;
  }

  p {
    color: #555;
    font-size: 0.95rem;
    margin-bottom: 25px;
  }

  button {
    width: 100%;
    padding: 15px;
    font-size: 1rem;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background: #1b5e20;
  }
</style>
</head>

<body>

<div class="card">
  <h1>🌾 Digital Krishi Mitra</h1>
  <p>Your trusted digital farming assistant</p>

  <button onclick="enterDashboard()">Enter Dashboard</button>
</div>

<script>
  function enterDashboard() {
    window.location.href = "/dashboard.html";
  }
</script>

</body>
</html>
