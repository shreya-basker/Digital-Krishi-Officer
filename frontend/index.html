<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌾 Agrisathi</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(-45deg, #4caf50, #a5d6a7, #e8f5e9, #ffffff);
    background-size: 400% 400%;
    animation: gradientFlow 12s ease infinite;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  @keyframes gradientFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card {
    background: #fff;
    padding: 32px;
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    width: 90%;
    max-width: 400px;
    text-align: center;
    box-sizing: border-box;
  }

  h1 {
    color: #2e7d32;
    margin-bottom: 6px;
    font-size: 1.9rem;
  }

  p {
    color: #555;
    font-size: 0.95rem;
    margin-bottom: 20px;
  }

  input, select {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-family: inherit;
    font-size: 1rem;
  }

  button {
    width: 100%;
    padding: 15px;
    font-size: 1rem;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
    font-family: inherit;
  }

  button:hover {
    background: #1b5e20;
  }

  button:disabled { background: #9e9e9e; cursor: wait; }

  .switch { margin-top: 14px; font-size: 0.9rem; }
  .switch a { color: #2e7d32; font-weight: 600; cursor: pointer; }
  .error { color: #c62828; font-size: 0.9rem; min-height: 1.2em; margin: 4px 0 10px; }
  .register-only { display: none; }
  .registering .register-only { display: block; }
</style>
</head>

<body>

<div class="card" id="card">
  <h1>🌾 Agrisathi</h1>
  <p>From farm data to farm decisions</p>

  <form id="authForm">
    <input class="register-only" id="name" placeholder="Your name" autocomplete="name">
    <input id="phone" type="tel" placeholder="Mobile number" autocomplete="tel" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <select class="register-only" id="language">
      <option value="en">English</option>
      <option value="ml">മലയാളം (Malayalam)</option>
      <option value="hi">हिन्दी (Hindi)</option>
    </select>
    <div class="error" id="error"></div>
    <button type="submit" id="submitBtn">Log in</button>
  </form>

  <div class="switch" id="switchText">New here? <a id="switchLink">Create an account</a></div>
</div>

<script src="api.js"></script>
<script>
  const card = document.getElementById("card");
  const errorEl = document.getElementById("error");
  const submitBtn = document.getElementById("submitBtn");
  let registering = false;

  if (Api.token()) goToApp();

  document.getElementById("switchText").addEventListener("click", (e) => {
    if (e.target.id !== "switchLink") return;
    registering = !registering;
    card.classList.toggle("registering", registering);
    submitBtn.innerText = registering ? "Create account" : "Log in";
    document.getElementById("switchText").innerHTML = registering
      ? 'Already registered? <a id="switchLink">Log in</a>'
      : 'New here? <a id="switchLink">Create an account</a>';
    errorEl.innerText = "";
  });

  document.getElementById("authForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.innerText = "";
    submitBtn.disabled = true;
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;
    try {
      const data = registering
        ? await Api.post("/auth/register", {
            phone, password,
            name: document.getElementById("name").value.trim() || "Farmer",
            language: document.getElementById("language").value,
          })
        : await Api.post("/auth/login", { phone, password });
      Api.saveSession(data);
      await goToApp();
    } catch (err) {
      errorEl.innerText = err.message;
    } finally {
      submitBtn.disabled = false;
    }
  });

  // New farmers set up their farm first; everyone else lands on the dashboard.
  async function goToApp() {
    const farm = await Api.currentFarm();
    location.href = farm && farm.active_cycle ? "dashboard.html" : "farm.html";
  }
</script>

</body>
</html>
