<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Farm - Agrisathi</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { font-family:'Poppins', sans-serif; margin:0; padding:0; background:#f4f9f4; }
  header { background:#2e7d32; color:white; padding:15px; text-align:center; font-size:1.5rem; }
  main { padding:15px; max-width:640px; margin:auto; }

  .section { background:white; padding:15px; margin-bottom:15px; border-radius:12px; box-shadow:0 3px 8px rgba(0,0,0,0.1); }
  .section h3 { margin:0 0 4px; color:#2e7d32; }
  .section .hint { margin:0 0 12px; font-size:0.85rem; color:#777; }

  label { display:block; font-size:0.85rem; color:#555; margin-bottom:4px; }
  input, select {
    width:100%; box-sizing:border-box; padding:10px; margin-bottom:12px; border-radius:10px; border:1px solid #ccc;
    font-size:1rem; font-family:inherit;
  }
  .row { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:0 12px; }

  button { padding:10px 20px; background:#2e7d32; color:white; border:none; border-radius:30px; cursor:pointer; transition:0.3s; font-family:inherit; font-size:0.95rem; }
  button:hover { background:#256608; }
  button.secondary { background:#e8f5e9; color:#2e7d32; }
  button.secondary:hover { background:#dcedc8; }
  button:disabled { background:#9e9e9e; cursor:wait; }
  .actions { text-align:center; }
  .error { color:#c62828; text-align:center; min-height:1.2em; }
  #locStatus { font-size:0.85rem; color:#555; margin:-4px 0 12px; }

  button.back { display:block; margin:15px auto; }
</style>
</head>
<body>

<header>🌱 My Farm</header>

<main>
  <form id="farmForm">
    <div class="section">
      <h3>Farm</h3>
      <p class="hint">Location is used for local weather and mandi prices.</p>
      <label for="farmName">Farm name</label>
      <input id="farmName" required placeholder="e.g. Home field">
      <div class="row">
        <div><label for="state">State</label><select id="state" required></select></div>
        <div><label for="district">District</label><input id="district" placeholder="e.g. Kolar"></div>
      </div>
      <div class="row">
        <div><label for="lat">Latitude</label><input id="lat" type="number" step="any" required></div>
        <div><label for="lon">Longitude</label><input id="lon" type="number" step="any" required></div>
      </div>
      <button type="button" class="secondary" id="locateBtn">📍 Use my current location</button>
      <div id="locStatus"></div>
      <div class="row">
        <div><label for="area">Area (hectares)</label><input id="area" type="number" step="0.01" min="0.01"></div>
        <div>
          <label for="irrigation">Irrigation</label>
          <select id="irrigation">
            <option value="drip">Drip</option>
            <option value="sprinkler">Sprinkler</option>
            <option value="flood">Flood / furrow</option>
            <option value="canal">Canal</option>
            <option value="rainfed">Rainfed (no irrigation)</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>Current crop</h3>
      <p class="hint">Crop stage is worked out from the sowing / transplanting date.</p>
      <div class="row">
        <div><label for="crop">Crop</label><select id="crop" required></select></div>
        <div><label for="variety">Variety (optional)</label><input id="variety"></div>
      </div>
      <label for="sowing">Sowing / transplanting date</label>
      <input id="sowing" type="date" required>
    </div>

    <div class="section">
      <h3>Soil Health Card</h3>
      <p class="hint">Optional, but needed for fertiliser advice. Enter values from your card.</p>
      <div class="row">
        <div><label for="n">Nitrogen (N, kg/ha)</label><input id="n" type="number" step="any" min="0"></div>
        <div><label for="p">Phosphorus (P, kg/ha)</label><input id="p" type="number" step="any" min="0"></div>
        <div><label for="k">Potassium (K, kg/ha)</label><input id="k" type="number" step="any" min="0"></div>
      </div>
      <div class="row">
        <div><label for="ph">pH</label><input id="ph" type="number" step="0.1" min="0" max="14"></div>
        <div><label for="oc">Organic carbon (%)</label><input id="oc" type="number" step="0.01" min="0"></div>
        <div><label for="sampled">Test date</label><input id="sampled" type="date"></div>
      </div>
    </div>

    <div class="error" id="error"></div>
    <div class="actions"><button type="submit" id="saveBtn">Save and see recommendations</button></div>
  </form>

  <button class="back secondary" onclick="window.location.href='dashboard.html'">⬅ Back to Dashboard</button>
</main>

<script src="api.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const num = (id) => $(id).value === "" ? null : Number($(id).value);
let farm = null;

async function init() {
  $("state").innerHTML = '<option value="">-- Select State --</option>' +
    INDIAN_STATES.map(s => `<option>${esc(s)}</option>`).join("");
  const crops = await Api.get("/crops");
  $("crop").innerHTML = crops.map(c => `<option value="${esc(c.key)}">${esc(c.label)}</option>`).join("");
  $("sowing").max = new Date().toISOString().slice(0, 10);

  farm = await Api.currentFarm();
  if (!farm) return;
  $("farmName").value = farm.name;
  $("state").value = farm.state;
  $("district").value = farm.district || "";
  $("lat").value = farm.lat;
  $("lon").value = farm.lon;
  $("area").value = farm.area_ha ?? "";
  $("irrigation").value = farm.irrigation_type;
  if (farm.active_cycle) {
    $("crop").value = farm.active_cycle.crop;
    $("variety").value = farm.active_cycle.variety || "";
    $("sowing").value = farm.active_cycle.sowing_date;
  }
  const s = farm.latest_soil;
  if (s) {
    $("n").value = s.nitrogen ?? ""; $("p").value = s.phosphorus ?? ""; $("k").value = s.potassium ?? "";
    $("ph").value = s.ph ?? ""; $("oc").value = s.organic_carbon ?? ""; $("sampled").value = s.sampled_on;
  }
}

$("locateBtn").addEventListener("click", () => {
  if (!navigator.geolocation) { $("locStatus").innerText = "Location is not available in this browser."; return; }
  $("locStatus").innerText = "Finding your location…";
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      $("lat").value = pos.coords.latitude.toFixed(4);
      $("lon").value = pos.coords.longitude.toFixed(4);
      $("locStatus").innerText = "Location set.";
    },
    () => { $("locStatus").innerText = "Could not get location. Enter latitude and longitude manually."; }
  );
});

$("farmForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("error").innerText = "";
  $("saveBtn").disabled = true;
  try {
    const farmBody = {
      name: $("farmName").value.trim(), state: $("state").value, district: $("district").value.trim() || null,
      lat: num("lat"), lon: num("lon"), area_ha: num("area"), irrigation_type: $("irrigation").value,
    };
    farm = farm ? await Api.put(`/farms/${farm.id}`, farmBody) : await Api.post("/farms", farmBody);
    localStorage.setItem("agrisathiFarmId", farm.id);

    const cycle = { crop: $("crop").value, variety: $("variety").value.trim() || null, sowing_date: $("sowing").value };
    const current = farm.active_cycle;
    // only start a new crop cycle when the crop or sowing date actually changed
    if (!current || current.crop !== cycle.crop || current.sowing_date !== cycle.sowing_date || (current.variety || null) !== cycle.variety) {
      await Api.post(`/farms/${farm.id}/crop-cycles`, cycle);
    }

    const soil = { nitrogen: num("n"), phosphorus: num("p"), potassium: num("k"), ph: num("ph"), organic_carbon: num("oc"),
                   sampled_on: $("sampled").value || null };
    const old = farm.latest_soil;
    const soilChanged = !old || ["nitrogen", "phosphorus", "potassium", "ph", "organic_carbon"].some(k => (old[k] ?? null) !== soil[k])
      || (soil.sampled_on && soil.sampled_on !== old.sampled_on);
    const hasSoil = ["nitrogen", "phosphorus", "potassium", "ph", "organic_carbon"].some(k => soil[k] !== null);
    if (hasSoil && soilChanged) await Api.post(`/farms/${farm.id}/soil`, soil);

    // farm details changed, so make the next dashboard visit regenerate recommendations
    await Api.get(`/farms/${farm.id}/recommendations?refresh=true`);
    location.href = "decisions.html";
  } catch (err) {
    $("error").innerText = err.message;
  } finally {
    $("saveBtn").disabled = false;
  }
});

if (Api.requireAuth()) init().catch(err => { $("error").innerText = err.message; });
</script>

</body>
</html>
