<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Decisions - Agrisathi</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { font-family:'Poppins', sans-serif; margin:0; padding:0; background:#f4f9f4; }
  header { background:#2e7d32; color:white; padding:15px; text-align:center; font-size:1.5rem; }
  main { padding:15px; max-width:1000px; margin:auto; }

  .layout { display:grid; grid-template-columns: minmax(220px, 1fr) 2fr; gap:15px; align-items:start; }
  @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }

  .section-title { color:#2e7d32; margin:0 0 10px; font-size:1rem; letter-spacing:0.5px; text-transform:uppercase; }
  .signal { background:white; padding:12px 15px; margin-bottom:10px; border-radius:12px; box-shadow:0 3px 8px rgba(0,0,0,0.1); border-left:5px solid #a5d6a7; }
  .signal small { color:#777; text-transform:uppercase; font-size:0.72rem; letter-spacing:0.5px; }
  .signal h4 { margin:2px 0; color:#333; font-size:0.98rem; }
  .signal p { margin:0; color:#555; font-size:0.85rem; }

  .engine { text-align:center; color:#2e7d32; font-weight:600; margin:4px 0 12px; font-size:0.85rem; }

  .rec { background:white; padding:15px; margin-bottom:15px; border-radius:12px; box-shadow:0 3px 8px rgba(0,0,0,0.1); display:flex; gap:14px; }
  .rec .rank { flex:0 0 38px; height:38px; border-radius:50%; background:#2e7d32; color:white; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:1.1rem; }
  .rec .body { flex:1; min-width:0; }
  .rec h3 { margin:0 0 4px; color:#2e7d32; font-size:1.05rem; }
  .rec p { margin:0 0 8px; color:#555; font-size:0.92rem; }
  .chips span { display:inline-block; margin:0 6px 6px 0; padding:2px 10px; border-radius:12px; background:#e8f5e9; color:#2e7d32; font-size:0.75rem; }
  .status { display:inline-block; font-size:0.75rem; padding:2px 10px; border-radius:12px; background:#fff3e0; color:#e65100; margin-left:6px; vertical-align:middle; }
  .status.accepted, .status.done { background:#e8f5e9; color:#2e7d32; }
  .status.rejected { background:#ffebee; color:#c62828; }

  .feedback { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .feedback button { padding:6px 14px; border-radius:20px; border:1px solid #2e7d32; background:white; color:#2e7d32; cursor:pointer; font-family:inherit; font-size:0.82rem; }
  .feedback button.primary { background:#2e7d32; color:white; }
  .outcome { margin-top:8px; display:none; }
  .outcome.open { display:block; }
  .outcome textarea { width:100%; box-sizing:border-box; border-radius:10px; border:1px solid #ccc; padding:8px; font-family:inherit; min-height:60px; }
  .outcome select { padding:6px; border-radius:8px; border:1px solid #ccc; font-family:inherit; margin:6px 6px 0 0; }

  .disclaimer { font-size:0.8rem; color:#777; background:#fffde7; border-radius:10px; padding:10px 12px; margin-bottom:15px; }
  .toolbar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .toolbar span { font-size:0.85rem; color:#777; }
  button.pill { padding:8px 18px; background:#2e7d32; color:white; border:none; border-radius:30px; cursor:pointer; font-family:inherit; }
  button.pill:disabled { background:#9e9e9e; cursor:wait; }
  button.back { display:block; margin:15px auto; padding:10px 20px; background:#2e7d32; color:white; border:none; border-radius:30px; cursor:pointer; font-family:inherit; }
  .muted { color:#777; }
</style>
</head>
<body>

<header>✅ Today's Decisions</header>

<main>
  <div class="toolbar">
    <span id="farmInfo"></span>
    <button class="pill" id="refreshBtn">🔄 Re-check with latest data</button>
  </div>

  <div class="layout">
    <section>
      <h2 class="section-title">Inputs</h2>
      <div id="signals"><p class="muted">Loading signals…</p></div>
      <div class="engine">⬇ Decision fusion engine ⬇</div>
    </section>

    <section>
      <h2 class="section-title">Recommended actions</h2>
      <div class="disclaimer" id="disclaimer"></div>
      <div id="recs"><p class="muted">Loading recommendations…</p></div>
    </section>
  </div>

  <button class="back" onclick="window.location.href='dashboard.html'">⬅ Back to Dashboard</button>
</main>

<script src="api.js"></script>
<script>
const SIGNAL_ICONS = { weather: "🌦️", soil: "🟫", crop: "🌱", pest: "🐛", market: "💹" };
const SIGNAL_LABELS = {
  irrigation_type: "irrigation", soil_moisture_level: "soil moisture", rain_outlook: "rain outlook",
  n_level: "soil N", p_level: "soil P", k_level: "soil K", ph_level: "soil pH", nitrogen_window: "N-responsive stage",
  heavy_rain_48h: "heavy rain", pest_risk: "pest risk", price_trend: "price trend", in_harvest_window: "harvest window",
  days_to_harvest_window: "days to harvest", crop_day: "crop day", temp_max_48h: "max temp",
};
let farm = null;

function chip(key, value) {
  if (typeof value === "boolean") value = value ? "yes" : "no";
  return `<span>${esc(SIGNAL_LABELS[key] || key)}: ${esc(value ?? "—")}</span>`;
}

async function loadSignals() {
  const data = await Api.get(`/farms/${farm.id}/signals`);
  document.getElementById("signals").innerHTML = data.signals.map(s => `
    <div class="signal">
      <small>${SIGNAL_ICONS[s.key] || ""} ${esc(s.label)}</small>
      <h4>${esc(s.value)}</h4>
      <p>${esc(s.detail)}</p>
    </div>`).join("");
}

async function loadRecs(refresh = false) {
  const data = await Api.get(`/farms/${farm.id}/recommendations${refresh ? "?refresh=true" : ""}`);
  document.getElementById("disclaimer").innerText = "⚠️ " + data.disclaimer;
  const recs = data.recommendations;
  const el = document.getElementById("recs");
  if (!recs.length) { el.innerHTML = '<p class="muted">No actions needed right now.</p>'; return; }
  el.innerHTML = recs.map(r => `
    <div class="rec" data-id="${r.id}">
      <div class="rank">${r.rank}</div>
      <div class="body">
        <h3>${esc(r.title)} ${r.status !== "shown" ? `<span class="status ${esc(r.status)}">${esc(r.status)}</span>` : ""}</h3>
        <p>${esc(r.rationale)}</p>
        <div class="chips">${Object.entries(r.signals).map(([k, v]) => chip(k, v)).join("")}</div>
        ${r.status === "rejected" || r.status === "done" ? "" : `
        <div class="feedback">
          ${r.status === "shown" ? '<button class="primary" data-action="accept">👍 Will do</button><button data-action="reject">Not useful</button>' : ""}
          <button data-action="done">✔ Done — log outcome</button>
        </div>
        <div class="outcome">
          <textarea placeholder="What did you do and what happened? (optional)"></textarea>
          <select><option value="">Rate this advice</option><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
          <button class="primary" data-action="submit-done">Save outcome</button>
        </div>`}
      </div>
    </div>`).join("");

  el.querySelectorAll("button[data-action]").forEach(btn => btn.onclick = async () => {
    const card = btn.closest(".rec");
    const action = btn.dataset.action;
    if (action === "done") { card.querySelector(".outcome").classList.add("open"); return; }
    const body = action === "submit-done"
      ? { action: "done", outcome_note: card.querySelector("textarea").value.trim() || null,
          rating: Number(card.querySelector("select").value) || null }
      : { action };
    btn.disabled = true;
    await Api.post(`/recommendations/${card.dataset.id}/feedback`, body);
    loadRecs();
  });
}

document.getElementById("refreshBtn").onclick = async (e) => {
  e.target.disabled = true;
  try { await Promise.all([loadSignals(), loadRecs(true)]); } finally { e.target.disabled = false; }
};

(async () => {
  if (!Api.requireAuth()) return;
  try {
    farm = await Api.currentFarm();
    if (!farm || !farm.active_cycle) { location.href = "farm.html"; return; }
    document.getElementById("farmInfo").innerText =
      `${farm.name} · ${farm.district ? farm.district + ", " : ""}${farm.state}`;
    await Promise.all([loadSignals(), loadRecs()]);
  } catch (err) {
    document.getElementById("recs").innerHTML = `<p class="muted">${esc(err.message)}</p>`;
  }
})();
</script>

</body>
</html>
