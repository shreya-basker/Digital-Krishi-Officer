  label: Wheat
  market_name: Wheat
  stages:
    - {key: establishment, label: Crown root initiation, start: 0, end: 25}
    - {key: tillering, label: Tillering, start: 26, end: 45}
    - {key: jointing, label: Jointing, start: 46, end: 70}
    - {key: flowering, label: Heading / flowering, start: 71, end: 90}
    - {key: grain_filling, label: Grain filling, start: 91, end: 115}
    - {key: harvest, label: Maturity / harvest, start: 116, end: 140}
  harvest_window: [110, 140]
  nitrogen_stages: [establishment, tillering]
  soil_moisture: {dry_below: 0.17, wet_above: 0.34}

