# Crop calendars used to derive crop stage from the sowing / transplanting date.
# Day ranges are typical Indian-season durations for planning only; real stages
# depend on variety, season and region. Soil-moisture thresholds are volumetric
# (m3/m3) for the 3-9 cm layer of a medium loam and are deliberately generic.

tomato:
  label: Tomato
  market_name: Tomato
  stages:
    - {key: establishment, label: Establishment, start: 0, end: 20}
    - {key: vegetative, label: Vegetative, start: 21, end: 40}
    - {key: flowering, label: Flowering, start: 41, end: 60}
    - {key: fruiting, label: Fruit development, start: 61, end: 85}
    - {key: harvest, label: Harvest, start: 86, end: 130}
  harvest_window: [75, 130]
  nitrogen_stages: [vegetative, flowering]
  soil_moisture: {dry_below: 0.18, wet_above: 0.34}

rice:
  label: Rice (paddy)
  market_name: Paddy(Dhan)(Common)
  stages:
    - {key: establishment, label: Seedling / establishment, start: 0, end: 20}
    - {key: tillering, label: Tillering, start: 21, end: 55}
    - {key: panicle_initiation, label: Panicle initiation, start: 56, end: 85}
    - {key: flowering, label: Flowering, start: 86, end: 100}
    - {key: grain_filling, label: Grain filling, start: 101, end: 120}
    - {key: harvest, label: Maturity / harvest, start: 121, end: 140}
  harvest_window: [110, 140]
  nitrogen_stages: [tillering, panicle_initiation]
  soil_moisture: {dry_below: 0.30, wet_above: 0.45}

