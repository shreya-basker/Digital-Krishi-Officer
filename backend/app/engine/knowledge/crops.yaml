    - {key: grain_filling, label: Grain filling, start: 66, end: 95}
    - {key: harvest, label: Maturity / harvest, start: 96, end: 120}
  harvest_window: [90, 120]
  nitrogen_stages: [vegetative]
  soil_moisture: {dry_below: 0.17, wet_above: 0.34}

cotton:
  label: Cotton
  market_name: Cotton
  stages:
