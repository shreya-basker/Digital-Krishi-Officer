    - {key: boll_development, label: Boll development, start: 101, end: 145}
    - {key: harvest, label: Picking, start: 146, end: 190}
  harvest_window: [140, 190]
  nitrogen_stages: [vegetative, flowering]
  soil_moisture: {dry_below: 0.16, wet_above: 0.34}

