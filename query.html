<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Your Query - Digital Krishi Mitra</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: #f4f9f4;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    background: #2b7a0b;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 1.5rem;
    font-weight: bold;
  }

  #chatContainer {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #e8f5e9;
  }

  .chat-bubble {
    padding: 10px 15px;
    border-radius: 15px;
    max-width: 80%;
    word-wrap: break-word;
    display: inline-block;
    position: relative;
    font-size: 0.9rem;
  }

  .chat-bubble.user {
    background: #2b7a0b;
    color: white;
    align-self: flex-end;
  }

  .chat-bubble.ai {
    background: #fff;
    color: #333;
    align-self: flex-start;
    border: 1px solid #ddd;
  }

  .timestamp {
    font-size: 10px;
    color: #888;
    margin-top: 3px;
  }

  #inputArea {
    display: flex;
    flex-wrap: wrap;
    padding: 10px;
    gap: 10px;
    align-items: center;
    justify-content: center;
    background: #fff;
    border-top: 1px solid #ddd;
  }

  #queryInput {
    flex: 1 1 150px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ccc;
    min-width: 100px;
    font-size: 1rem;
  }

  #imageInput {
    flex: 0 0 auto;
  }

  #imagePreview {
    max-width: 80px;
    max-height: 80px;
    border-radius: 10px;
    display: none;
  }

  button {
    flex: 0 0 auto;
    background: #2b7a0b;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
    font-size: 0.9rem;
  }

  button:hover {
    background: #256608;
  }

  #backBtn {
    background: #555;
    margin: 10px auto;
    display: block;
    width: 90%;
    max-width: 400px;
  }

  /* Scrollbar style for chat container */
  #chatContainer::-webkit-scrollbar {
    width: 6px;
  }
  #chatContainer::-webkit-scrollbar-thumb {
    background-color: rgba(0,0,0,0.2);
    border-radius: 3px;
  }

  /* Mobile adjustments */
  @media (max-width: 480px) {
    header { font-size: 1.3rem; }
    #queryInput { font-size: 0.9rem; padding: 8px; }
    button { padding: 8px 12px; font-size: 0.85rem; }
    .chat-bubble { font-size: 0.85rem; }
    #imagePreview { max-width: 60px; max-height: 60px; }
  }
</style>
</head>
<body>

<header>🌾 Digital Krishi Mitra</header>

<!-- Chat Container -->
<div id="chatContainer">
  <div class="chat-bubble ai">
    Hello! How can I assist you with farming today?
    <div class="timestamp" style="text-align:left;">{{now}}</div>
  </div>
</div>

<!-- Input Area -->
<div id="inputArea">
  <input type="text" id="queryInput" placeholder="Type your query here...">
  <input type="file" id="imageInput" accept="image/*">
  <img id="imagePreview" alt="Preview">
  <button id="submitBtn">Send</button>
  <button id="voiceBtn">🎤 Speak</button>
  <button id="ttsBtn">🔊 Read</button>
</div>

<button id="backBtn" onclick="window.location.href='dashboard.html'">⬅ Back to Dashboard</button>

<!-- Firebase v8 SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<!-- Query Logic -->
<script src="query.js"></script>
</body>
</html>
